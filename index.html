<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mail sweeper</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --bg:#eef2f4; --ink:#14232b; --muted:#5b6b73; --line:#cfd8dd; --accent:#1f6f5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:calc(72px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(150px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  h1 { font-size:1.45rem; margin:0; }
  h2 { font-size:1.1rem; margin:0 0 10px; scroll-margin-top:100px; }
  #topbar { position:fixed; z-index:5; top:0; left:0; right:0; background:var(--bg); border-bottom:1px solid var(--line); padding: max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left)); }
  #topinner { max-width:680px; margin:auto; }
  #status { display:none; color:var(--muted); margin:2px 0 0; min-height:1.35em; font-size:.9rem; }
  body[data-tab="data"] #status, body.status-attention #status { display:block; }
  #status.alert { color:var(--ink); font-weight:650; }
  #connectedLabel { display:none; color:var(--muted); font-weight:600; padding:10px 0; }
  #connect.connected { display:none; }
  #connectedLabel.visible { display:block; }
  .bar { height:8px; background:var(--line); border-radius:5px; overflow:hidden; margin-top:8px; }
  #fill { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #counts { margin:5px 0 0; font-size:.85rem; font-variant-numeric:tabular-nums; }
  .tab { display:none; }
  .tab.active { display:block; }
  .panel { background:rgba(255,255,255,.55); border:1px solid var(--line); border-radius:10px; padding:16px; margin:0 0 16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  button { font:inherit; min-height:48px; padding:10px 14px; touch-action:manipulation; border:1px solid var(--ink); background:transparent; color:var(--ink); border-radius:7px; }
  button.primary { background:var(--ink); color:#fff; }
  button.danger { background:#8a2c2c; border-color:#8a2c2c; color:#fff; }
  button:disabled { opacity:.4; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #connect,#dataAction,#pause { width:100%; }
  #filterFields label,.field label { display:block; color:var(--muted); font-size:.9rem; margin:12px 0 0; }
  input,select { display:block; width:100%; min-height:48px; margin-top:4px; padding:8px 10px; font:inherit; font-size:16px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:6px; }
  .fieldgrid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .hint,.muted { color:var(--muted); font-size:.9rem; }
  .summary { font-weight:650; margin:8px 0; font-variant-numeric:tabular-nums; }
  .segmented { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 12px; }
  .segmented button { padding:8px 5px; font-size:.9rem; min-height:48px; }
  .segmented button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  #results,#matches { list-style:none; margin:0; padding:0; }
  #results li,#matches li { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); }
  #results li { cursor:pointer; }
  #results li:focus-visible { outline:3px solid var(--accent); }
  .who { min-width:0; overflow-wrap:anywhere; }
  .sub { display:block; color:var(--muted); font-size:.84rem; }
  .size { flex:none; text-align:right; font-weight:650; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .checkrow { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .checkrow input[type=checkbox],#selectAll { width:24px; height:24px; min-height:24px; margin:0; flex:none; accent-color:var(--accent); }
  .matchtext { min-width:0; overflow-wrap:anywhere; }
  #reviewFilters summary { min-height:44px; display:flex; align-items:center; font-weight:650; cursor:pointer; }
  #reviewFilters[open] summary { margin-bottom:8px; }
  #pagination { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin:12px 0 4px; }
  #pagination button { min-width:0; padding:8px; }
  #pageJump { display:flex; align-items:center; gap:5px; font-size:.9rem; }
  #pageNumber { width:64px; min-height:44px; margin:0; text-align:center; }
  #showing { font-size:.88rem; font-weight:650; margin:18px 0 4px; font-variant-numeric:tabular-nums; }
  #selectionSummary { font-weight:650; margin:10px 0; }
  #actions { position:fixed; z-index:5; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left)); }
  #actionInner { max-width:648px; margin:0 auto; display:flex; gap:8px; }
  #trashSelected { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #moreActions { position:relative; flex:none; width:48px; min-width:48px; height:48px; padding:0; font-size:1.4rem; }
  #moreMenu { position:absolute; right:0; bottom:54px; width:min(290px,calc(100vw - 32px)); padding:12px; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 4px 18px #14232b22; }
  #moreMenu[hidden] { display:none; }
  #moreMenu button { width:100%; margin-top:8px; }
  #optional { margin-top:10px; }
  #optional label { display:block; margin-top:8px; color:var(--muted); }
  #reviewTab { padding-bottom:132px; }
  #reviewListPanel { padding-bottom:10px; }
  #reviewFilters summary { list-style:none; gap:.4em; }
  #reviewFilters .chev { flex:none; width:24px; height:24px; margin-left:auto; display:flex; align-items:center; justify-content:center; transition:transform .2s; }
  #reviewFilters .chev::before { content:""; width:9px; height:9px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:translateY(-3px) rotate(45deg); }
  #reviewFilters:not([open]) .chev { transform:rotate(180deg); }
  #reviewFilters summary::-webkit-details-marker { display:none; }
  #typeChips, #attachChips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #filterFields .type-chip { position:relative; display:block; margin:0; color:var(--ink); font-size:.9rem; }
  .type-chip input { position:absolute; inset:0; width:100%; height:100%; min-height:0; margin:0; opacity:0; cursor:pointer; }
  .type-chip span { display:flex; align-items:center; min-height:44px; padding:8px 16px; border:1px solid var(--line); border-radius:22px; background:#fff; color:var(--ink); user-select:none; transition:background .15s,color .15s,border-color .15s; }
  .type-chip input:checked + span { background:var(--ink); border-color:var(--ink); color:#fff; }
  .type-chip input:focus-visible + span { outline:3px solid var(--accent); outline-offset:2px; }
  #selectionSummary { margin:6px 0 12px; }
  #showing { margin:18px 0 4px; }
  #pagination { margin-top:4px; }
  #reviewTab > .panel { margin-bottom:10px; }
  #tabs { position:fixed; z-index:6; bottom:0; left:0; right:0; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:7px max(10px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); background:var(--bg); border-top:1px solid var(--line); }
  #tabs button { border:0; min-height:50px; padding:7px 4px; font-size:.9rem; }
  #tabs button[aria-current="page"] { background:var(--ink); color:#fff; }
  .empty { padding:20px 4px; color:var(--muted); }
  #stripPreview[hidden] { display:none; }
  #stripPreview h2 { margin-bottom:6px; }
  #stripPreview p { margin:6px 0; overflow-wrap:anywhere; }
  #stripPreview ul { margin:4px 0 8px; padding-left:20px; overflow-wrap:anywhere; }
  #stripPreview button { width:100%; }
  #results li.sectionHeader { cursor:default; display:block; padding:18px 2px 6px; border-bottom:2px solid var(--ink); font-weight:700; }
  #results li.disabled { cursor:default; opacity:.65; }
  @media (max-width:390px) { .segmented button { font-size:.8rem; } #pagination { grid-template-columns:1fr auto 1fr; gap:4px; } #pagination button { font-size:.85rem; } }
</style>
</head>
<body>
<header id="topbar"><div id="topinner"><h1>Mail sweeper</h1><p id="status">Not connected.</p></div></header>
<main>
  <section id="dataTab" class="tab active" aria-labelledby="dataHeading">
    <div class="panel">
      <h2 id="dataHeading">Gmail data</h2>
      <button id="connect" class="primary">Connect Gmail</button>
      <div id="connectedLabel" aria-live="polite">Connected</div>
      <button id="dataAction" disabled>Scan Gmail</button>
      <button id="pause" disabled>Pause</button>
      <div class="bar"><div id="fill"></div></div>
      <p id="counts"></p>
      <p id="lastSynced" class="hint">Not synced yet.</p>
    </div>
  </section>
  <section id="exploreTab" class="tab" aria-labelledby="exploreHeading">
    <h2 id="exploreHeading">Explore your mail</h2>
    <div class="segmented" role="group" aria-label="Explore view">
      <button id="exploreSpace" aria-pressed="true">Where's the space?</button>
      <button id="exploreSenders" aria-pressed="false">Top senders</button>
      <button id="exploreBiggest" aria-pressed="false">Biggest messages</button>
    </div>
    <ul id="results" aria-live="polite"><li class="empty">Scan Gmail to explore your messages.</li></ul>
  </section>
  <section id="reviewTab" class="tab" aria-labelledby="reviewHeading">
    <h2 id="reviewHeading">Review messages</h2>
    <div class="panel">
      <details id="reviewFilters" open>
        <summary>Filters <span id="filterSummary" class="muted"></span><span class="chev" aria-hidden="true"></span></summary>
        <div id="filterFields">
          <label>Sender contains <input id="fSender" type="text" placeholder="e.g. caltech.edu" autocomplete="off"></label>
          <div class="fieldgrid">
            <label>Size from (MB) <input id="fSizeFrom" type="number" min="0" step="0.1" inputmode="decimal" placeholder="No minimum"></label>
            <label>Size to (MB) <input id="fSizeTo" type="number" min="0" step="0.1" inputmode="decimal" placeholder="No maximum"></label>
            <label>Age from (years) <input id="fAgeFrom" type="number" min="0" step="0.5" inputmode="decimal" placeholder="No minimum"></label>
            <label>Age to (years) <input id="fAgeTo" type="number" min="0" step="0.5" inputmode="decimal" placeholder="No maximum"></label>
          </div>
          <div class="field"><label>Type (select any combination)</label>
            <div id="typeChips" role="group" aria-label="Message types">
              <label class="type-chip"><input type="checkbox" data-type="sent"><span>Sent</span></label>
              <label class="type-chip"><input type="checkbox" data-type="notsent"><span>Everything except Sent</span></label>
              <label class="type-chip"><input type="checkbox" data-type="promotions"><span>Promotions</span></label>
              <label class="type-chip"><input type="checkbox" data-type="social"><span>Social</span></label>
              <label class="type-chip"><input type="checkbox" data-type="updates"><span>Updates</span></label>
              <label class="type-chip"><input type="checkbox" data-type="forums"><span>Forums</span></label>
              <label class="type-chip"><input type="checkbox" data-type="inbox"><span>Inbox</span></label>
              <label class="type-chip"><input type="checkbox" data-type="archived"><span>Archived</span></label>
            </div>
          </div>
          <div class="field"><label>Attachments</label>
            <div id="attachChips" role="group" aria-label="Attachment filter">
              <label class="type-chip"><input type="checkbox" id="fAttach"><span>Has attachments</span></label>
            </div>
          </div>
          <div class="row"><button id="clearFilters">Clear filters</button></div>
        </div>
      </details>
    </div>
    <div class="panel" id="stripPreview" hidden aria-live="polite"></div>
    <div class="panel" id="reviewListPanel">
      <div class="checkrow"><input id="selectAll" type="checkbox" aria-label="Select all matching messages"><label for="selectAll"><strong>Select all matches</strong></label></div>
      <p id="selectionSummary">0 selected</p>
      <ul id="matches" aria-live="polite"><li class="empty">Open Review to load your messages.</li></ul>
      <p id="showing">Showing 0–0 of 0</p>
      <nav id="pagination" aria-label="Review pages">
        <button id="prevPage" disabled>← Previous</button>
        <label id="pageJump">Page <input id="pageNumber" type="number" min="1" value="1" inputmode="numeric" aria-label="Go to page"> <span id="pageTotal">of 1</span></label>
        <button id="nextPage" disabled>Next →</button>
      </nav>
    </div>
    <div id="actions">
      <div id="actionInner">
        <button id="trashSelected" class="danger" disabled>Trash 0</button>
        <button id="moreActions" aria-label="More actions" aria-expanded="false" aria-controls="moreMenu">⋯</button>
      </div>
      <div id="moreMenu" hidden>
        <button id="undoTrash">Undo last trash</button>
        <button id="previewStrip">Preview strip attachments…</button>
        <details id="optional">
          <summary>Add Gmail label…</summary>
          <label>Label name <input id="fLabel" type="text" value="Sweeper review"></label>
          <button id="applyLabel">Apply label to selected</button>
        </details>
      </div>
    </div>
  </section>
</main>
<nav id="tabs" aria-label="Main tabs">
  <button id="tabData" aria-current="page">Data</button>
  <button id="tabExplore">Explore</button>
  <button id="tabReview">Review</button>
</nav>
<script>
const CLIENT_ID = '164588121644-fqbd137vllni6v951h5um974agbnrhs0.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/gmail.modify';
const API = 'https://gmail.googleapis.com/gmail/v1/users/me';
const WORKERS = 8;        // parallel requests in flight; the pacer below sets the real speed
let rate = 25;            // requests/sec we allow ourselves; drops on rate limits, creeps back up
const RATE_MIN = 4, RATE_MAX = 40;
let nextSlot = 0;         // pacing schedule: each request takes the next free time slot
let gate = 0;             // shared pause: nothing is sent before this timestamp
let okStreak = 0, throttled = false;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const say = (t, alert = false) => {
  $('status').textContent = t;
  $('status').classList.toggle('alert', alert);
  const attention = alert || running || syncing;
  document.body.classList.toggle('status-attention', attention);
};
function updateStatusVisibility() {
  document.body.dataset.tab = activeTab;
  document.body.classList.toggle('status-attention', !!(running || syncing || $('status').classList.contains('alert')));
}
// Messages from background retries must never overwrite a final status like "Paused" or "Session expired".
const sayIfRunning = t => { if (running) say(t); };
const msgs = n => n.toLocaleString() + (n === 1 ? ' message' : ' messages');
const fmt = b => b >= 1024**3 ? (b/1024**3).toFixed(2)+' GB' : b >= 1024**2 ? (b/1024**2).toFixed(1)+' MB' : b >= 1024 ? Math.round(b/1024)+' KB' : Math.round(b)+' B';

let token = null, running = false, total = 0, done = 0, scanStart = 0, doneAtStart = 0;
let needsReconnect = false, scanGen = 0, skipped = 0, badStreak = 0, syncing = false, resumeFn = null;

/* ---------- IndexedDB ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('mailsweeper', 1);
  r.onupgradeneeded = () => {
    r.result.createObjectStore('msgs', { keyPath: 'id' });
    r.result.createObjectStore('meta');
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function run(store, mode, fn) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const getMeta = k => run('meta', 'readonly', s => s.get(k));
const setMeta = (k, v) => run('meta', 'readwrite', s => { s.put(v, k); });
const countMsgs = () => run('msgs', 'readonly', s => s.count());
const putMany = rows => run('msgs', 'readwrite', s => { rows.forEach(r => s.put(r)); });
async function missing(ids) {
  const db = await dbp;
  return new Promise(res => {
    const t = db.transaction('msgs');
    const s = t.objectStore('msgs'), out = [];
    ids.forEach(id => { s.getKey(id).onsuccess = e => { if (e.target.result === undefined) out.push(id); }; });
    t.oncomplete = () => res(out);
  });
}

/* ---------- Auth ---------- */
function expireForAction() {
  token = null; needsReconnect = false;
  $('connect').textContent = 'Reconnect Gmail';
  $('connect').classList.remove('connected'); $('connectedLabel').classList.remove('visible');
  $('dataAction').disabled = true;
  say('Your Gmail session expired. Tap Reconnect Gmail, then retry the action. Check Gmail first if a bulk action was interrupted.', true);
}
function needReconnect() {
  needsReconnect = true;
  token = null;
  $('dataAction').disabled = true;
  $('pause').disabled = true;
  $('connect').textContent = 'Reconnect & resume';
  $('connect').classList.remove('connected'); $('connectedLabel').classList.remove('visible');
  say('Paused: your Gmail session expired (they last about an hour). Tap "Reconnect & resume" to carry on where you left off. Nothing was lost.', true);
}
function connect() {
  if (!window.google) { say('Google sign-in is still loading. Try again.'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: r => {
      if (r.error) { say('Sign-in failed: ' + r.error, true); return; }
      token = r.access_token;
      const resume = needsReconnect;
      needsReconnect = false;
      $('connect').textContent = 'Connect Gmail';
      $('connect').classList.add('connected'); $('connectedLabel').classList.add('visible');
      updateDataAction();
      if (resume) (resumeFn || scan)(); // came here because the session expired: carry on automatically
      else say('Connected. Choose Scan Gmail to begin. Sessions last about an hour.');
    }
  });
  client.requestAccessToken();
}

/* ---------- Gmail API with backoff ---------- */
async function api(path, opts = {}) {
  for (let a = 0; a < 8; a++) {
    // Wait for any shared pause, then take the next slot in the pacing schedule.
    const now = Date.now();
    const slot = Math.max(now, nextSlot, gate);
    nextSlot = slot + 1000 / rate;
    if (slot > now) await sleep(slot - now);
    let r;
    try {
      r = await fetch(API + path, {
        ...opts,
        headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
      });
    } catch (e) {
      // "Failed to fetch": network dropped, phone slept, or an error response with no CORS headers.
      const ms = Math.min(30000, 1000 * 2 ** a) + Math.random() * 500;
      gate = Math.max(gate, Date.now() + ms);
      throttled = true;
      sayIfRunning(`Connection hiccup. Retrying in ${Math.round(ms / 1000)}s…`);
      continue;
    }
    if (r.ok) {
      if (throttled && Date.now() >= gate) { throttled = false; sayIfRunning('Scanning…'); }
      if (++okStreak >= 100 && rate < RATE_MAX) { rate = Math.min(RATE_MAX, rate + 2); okStreak = 0; }
      const text = await r.text();
      return text ? JSON.parse(text) : null; // batchModify answers 204 with no body
    }
    if (r.status === 401) { running = false; throw new Error('expired'); } // stop every worker
    const body = await r.json().catch(() => ({}));
    const err = body.error || {};
    const reason = (err.errors && err.errors[0] && err.errors[0].reason) || '';
    const limited = r.status === 429 || (r.status === 403 && /rate|quota/i.test(reason));
    if (limited || r.status >= 500) {
      okStreak = 0;
      rate = Math.max(RATE_MIN, rate * 0.7);
      let ms = Math.min(60000, 1500 * 2 ** a) + Math.random() * 500;
      // Google's message often says exactly when to retry; use that instead of guessing.
      const m = (err.message || '').match(/Retry after (\d{4}-\d\d-\d\dT[\d:.]+Z)/);
      if (m) ms = Math.min(120000, Math.max(1000, Date.parse(m[1]) - Date.now())) + Math.random() * 300;
      gate = Math.max(gate, Date.now() + ms);
      throttled = true;
      sayIfRunning(`Gmail asked us to slow down. Waiting ${Math.round(ms / 1000)}s, then continuing…`);
      continue;
    }
    const e = new Error(`HTTP ${r.status}: ${err.message || reason || 'request failed'}`);
    e.status = r.status;
    e.path = path.split('?')[0]; // which call failed, to make errors diagnosable
    throw e;
  }
  throw new Error('Gave up after repeated network or rate-limit errors. Check your connection, then press Start scan to resume.');
}

/* ---------- Keep the screen awake while scanning (phones) ---------- */
let wake = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) { /* not supported or denied: scan still works */ }
}
// The browser drops the lock whenever the tab is hidden; take it back when we return.
document.addEventListener('visibilitychange', () => {
  if (running && document.visibilityState === 'visible') keepAwake(true);
});

/* ---------- Scan ---------- */
async function countBad() {
  const db = await dbp;
  return new Promise(res => {
    let n = 0;
    const t = db.transaction('msgs');
    t.objectStore('msgs').openCursor().onsuccess = e => {
      const c = e.target.result;
      if (!c) return;
      if (c.value.bad) n++;
      c.continue();
    };
    t.oncomplete = () => res(n);
  });
}
function progress() {
  $('fill').style.width = total ? Math.min(100, done / total * 100) + '%' : '0';
  let line = `${done.toLocaleString()} of ${total.toLocaleString()} messages scanned`;
  const secs = (Date.now() - scanStart) / 1000, r = (done - doneAtStart) / secs;
  if (running && scanStart && secs > 20 && r > 0.5) {
    const min = Math.ceil((total - done) / r / 60);
    line += ` (about ${r.toFixed(0)}/sec, ${min > 90 ? Math.round(min / 60) + ' h' : min + ' min'} left)`;
  }
  if (skipped) line += `, ${skipped} unreadable`;
  $('counts').textContent = line;
}
async function pool(items, n, fn) {
  let i = 0;
  const g = scanGen; // workers from an earlier, aborted scan must not keep going
  await Promise.all(Array.from({ length: n }, async () => {
    while (running && g === scanGen && i < items.length) await fn(items[i++]);
  }));
}
function parseSender(headers) {
  const v = (headers && headers[0] && headers[0].value) || 'unknown';
  const m = v.match(/<([^>]+)>/);

// Ask Gmail what changed since startId and apply it to the local copy.
async function syncHistory(startId) {

    const r = await api(`/history?startHistoryId=${startId}&maxResults=500&historyTypes=messageAdded&historyTypes=messageDeleted&historyTypes=labelAdded&historyTypes=labelRemoved` + (page ? '&pageToken=' + page : ''));

    (h.messagesDeleted || []).forEach(x => { gone.add(x.message.id); fresh.delete(x.message.id); });

}

function buildZip(entries) { // entries: [{name, data: Uint8Array, date: Date}]

  const chunks = [], central = [];
  let offset = 0;
  entries.forEach(({ name, data, date }) => {
    const nameBytes = enc.encode(name), crc = crc32(data), dt = dosDateTime(date || new Date());
    const local = new Uint8Array(30 + nameBytes.length), lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, dt.time, true); lv.setUint16(12, dt.date, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true); lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);
    const cent = new Uint8Array(46 + nameBytes.length), cv = new DataView(cent.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true); cv.setUint16(12, dt.time, true); cv.setUint16(14, dt.date, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);
    cent.set(nameBytes, 46);
    central.push(cent);
    offset += local.length + data.length;
  });
  const centralStart = offset;
  let centralSize = 0;
  central.forEach(c => { chunks.push(c); centralSize += c.length; });
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true); ev.setUint32(16, centralStart, true); ev.setUint16(20, 0, true);
  chunks.push(end);
  let total = 0; chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let pos = 0; chunks.forEach(c => { out.set(c, pos); pos += c.length; });
  return out;
}
function zipFileName(m, subject) {
  const date = m.date ? new Date(m.date).toISOString().slice(0, 10) : 'undated';
  return `${date} ${safeName(subject || '(no subject)', 80)}.zip`;
}
function triggerDownload(filename, bytes) {
  const blob = new Blob([bytes], { type: 'application/zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function downloadStripZip() {
  if (!lastPreview || !lastPreview.analysis.remove.length) return;
  const { m, rawBin, analysis } = lastPreview;
  const names = dedupeNames(analysis.remove.map(x => safeName(x.name)));
  const entries = analysis.remove.map((item, i) => ({
    name: names[i], data: decodeAttachmentBytes(rawBin, item), date: m.date ? new Date(m.date) : new Date()
  }));
  const zip = buildZip(entries);
  triggerDownload(zipFileName(m, analysis.subject), zip);
  say(`Downloaded ${msgs(entries.length)} as a zip. Nothing was changed in Gmail.`);
}
/* ---------- Strip attachments, stage 3: insert a stripped copy (verify only, no trash) ---------- */
// Inserts a real copy into Gmail so it can be checked by hand; the original is never touched
// or trashed here (that's stage 4, once this has been verified against real Gmail).
function binaryToB64url(bin) {
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
// Rebuilds the raw message with the attachments in analysis.remove excised and a note part
// added, keeping every original header and every kept part's bytes untouched. Only handles
// attachments that are direct children of the top-level multipart (the common case); returns
// null if any removable attachment is nested deeper, so the caller can skip and report it
// rather than guess at a riskier splice.
function buildStrippedRaw(s, analysis) {
  const root = parsePart(s, 0, s.length);
  if (!root.type.startsWith('multipart/') || !root.children.length) return null;
  const removeKeys = new Set(analysis.remove.map(x => x.bodyStart + ':' + x.end));
  let matched = 0;
  const kept = [];
  root.children.forEach(c => {
    if (removeKeys.has(c.bodyStart + ':' + c.end)) { matched++; return; }
    kept.push(c);
  });
  if (matched !== analysis.remove.length) return null; // a target wasn't a direct child: too risky to splice
  const ctHdr = root.hdr.find(h => h.name === 'content-type');
  const boundary = parseHeaderValue(ctHdr ? ctHdr.value : '').params.boundary;
  if (!boundary) return null;
  const pieces = kept.map(c => `--${boundary}\r\n` + s.slice(c.start, c.end) + `\r\n`);
  pieces.push(`--${boundary}\r\nContent-Type: text/plain; charset="utf-8"\r\n\r\n${STRIP_NOTE_TEXT}\r\n`);
  pieces.push(`--${boundary}--\r\n`);
  return s.slice(0, root.bodyStart) + pieces.join('');
}
function renderInsertResult(check, origThreadId) {
  const box = $('stripPreview'), closeBtn = $('stripPreviewClose');
  const add = (tag, text, cls) => { const n = document.createElement(tag); n.textContent = text; if (cls) n.className = cls; box.insertBefore(n, closeBtn); return n; };
  add('h2', 'Stripped copy inserted');
  add('p', `New message id: ${check.id}`, 'summary');
  const sameThread = check.threadId === origThreadId;
  add('p', `Same thread as original: ${sameThread ? 'yes' : 'no — check this in Gmail'}`, sameThread ? 'muted' : 'summary');
  add('p', `Labels on the copy: ${(check.labelIds || []).join(', ') || '(none)'}`, 'muted');
  add('p', `Copy size: ${fmt(check.sizeEstimate || 0)}`, 'muted');
  add('p', 'The original message was not changed or trashed. Check the copy in Gmail — date, thread placement, read state and the note text — before anything else.', 'hint');
  box.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
async function insertStrippedCopy() {
  if (!lastPreview || !lastPreview.analysis.remove.length) return;
  const { rawBin, analysis, labelIds, threadId } = lastPreview;
  const newRaw = buildStrippedRaw(rawBin, analysis);
  if (!newRaw) { say('Could not safely rebuild this message (an attachment is nested too deep); skipped.', true); return; }
  const ok = confirm('Insert a stripped copy of this message into Gmail so you can check it? The original will not be changed or trashed.');
  if (!ok) { say('Cancelled. Nothing was changed.'); return; }
  say('Inserting the stripped copy…');
  try {
    const body = { raw: binaryToB64url(newRaw), labelIds: labelIds || [], threadId };
    const inserted = await api('/messages?internalDateSource=dateHeader', { method: 'POST', body: JSON.stringify(body) });
    const check = await api(`/messages/${inserted.id}?format=metadata&fields=id,threadId,labelIds,sizeEstimate`);
    renderInsertResult(check, threadId);
    say('Inserted. Check it in Gmail before doing anything else — the original was not touched.');
  } catch (e) {
    if (e.message === 'expired') { expireForAction(); return; }
    say('Insert failed: ' + e.message + '. The original was not touched.', true);
  }
}
async function updateDataAction() {
  const meta=(await getMeta('scan'))||{},history=await getMeta('history');
  $('dataAction').textContent=meta.pageToken?'Resume scan':history&&history.id?'Sync with Gmail':'Scan Gmail';
  $('dataAction').disabled=!token||running||syncing;
  $('pause').disabled=!running;
  $('connect').classList.toggle('connected',!!token); $('connectedLabel').classList.toggle('visible',!!token);
  $('lastSynced').textContent=history&&history.at?`Last synced ${new Date(history.at).toLocaleString()}.`:'Not synced yet.';
}
async function runDataAction() {
  if(!token){say('Connect Gmail first.',true);return;}
  const meta=(await getMeta('scan'))||{},history=await getMeta('history');
  if(meta.pageToken) await scan(); else if(history&&history.id) await sync(); else await scan({fresh:true});
  await updateDataAction();
}
async function openReview() { await refreshReview(); }

['fSender','fSizeFrom','fSizeTo','fAgeFrom','fAgeTo'].forEach(id => $(id).addEventListener('input',()=>recomputeMatches(true)));
document.querySelectorAll('#typeChips input').forEach(cb=>cb.addEventListener('change',()=>{
  const sent=document.querySelector('#typeChips input[data-type=sent]'), notsent=document.querySelector('#typeChips input[data-type=notsent]');
  if(cb===sent&&sent.checked)notsent.checked=false;
  if(cb===notsent&&notsent.checked)sent.checked=false;
  recomputeMatches(true);
}));
$('clearFilters').onclick = () => { ['fSender','fSizeFrom','fSizeTo','fAgeFrom','fAgeTo'].forEach(id=>$(id).value='');document.querySelectorAll('#typeChips input').forEach(cb=>cb.checked=false);$('fAttach').checked=false;recomputeMatches(true); };
$('moreActions').onclick = () => { const menu=$('moreMenu'), open=menu.hidden; menu.hidden=!open; $('moreActions').setAttribute('aria-expanded',String(open)); };
document.addEventListener('click',e=>{if(!$('moreMenu').contains(e.target)&&e.target!==$('moreActions')){$('moreMenu').hidden=true;$('moreActions').setAttribute('aria-expanded','false');}});
$('trashSelected').onclick = trashSelected;
$('undoTrash').onclick = undoTrash;
$('applyLabel').onclick = applyLabel;
$('previewStrip').onclick = previewStrip;
$('fAttach').addEventListener('change', async () => {
  if ($('fAttach').checked && !(await ensureAttachIds())) $('fAttach').checked = false;
  recomputeMatches(true);
});
countMsgs().then(async n => { if(n){done=n;$('counts').textContent=`${n.toLocaleString()} messages saved from an earlier scan`;} await updateDataAction(); });
