<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mail sweeper</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --bg:#eef2f4; --ink:#14232b; --muted:#5b6b73; --line:#cfd8dd; --accent:#1f6f5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  #status { color:var(--muted); margin:0 0 16px; min-height:1.5em; }
  #status.alert { color:var(--ink); font-weight:600; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
  #fill { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #counts { margin:8px 0 16px; font-variant-numeric:tabular-nums; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .row button { flex:1 1 calc(50% - 8px); }
  button { font:inherit; min-height:48px; padding:10px 14px; touch-action:manipulation; border:1px solid var(--ink); background:transparent; color:var(--ink); border-radius:6px; }
  button.primary { background:var(--ink); color:#fff; }
  button:disabled { opacity:.4; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #filter { margin:0 0 24px; }
  #filter h2 { font-size:1.1rem; margin:0 0 4px; }
  #filter label { display:block; margin:14px 0 0; font-size:.95rem; color:var(--muted); }
  #filter input, #filter select { display:block; width:100%; min-height:48px; margin-top:4px; padding:8px 12px; font:inherit; font-size:16px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:6px; }
  .match { font-weight:600; margin:16px 0 0; min-height:1.5em; }
  #filter .row { margin:16px 0 0; }
  #list { list-style:none; margin:0; padding:0; }
  #list li { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .who { word-break:break-word; min-width:0; }
  .sub { display:block; color:var(--muted); font-size:.85rem; }
  #list li.head { display:block; font-weight:700; padding:22px 0 8px; border-bottom:2px solid var(--ink); }
  .size { font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .num { display:block; color:var(--muted); font-size:.85rem; font-weight:400; text-align:right; }
</style>
</head>
<body>
<main>
  <h1>Mail sweeper</h1>
  <p id="status">Not connected.</p>
  <div class="bar"><div id="fill"></div></div>
  <p id="counts"></p>
  <div class="row">
    <button id="connect" class="primary">Connect Gmail</button>
    <button id="scan" disabled>Start scan</button>
    <button id="sync" disabled>Sync with Gmail</button>
    <button id="stop" disabled>Pause</button>
    <button id="report">Top senders</button>
    <button id="overview">Where's the space?</button>
    <button id="biggest">Biggest messages</button>
    <button id="review">Review &amp; label</button>
  </div>
  <section id="filter" hidden>
    <h2>Review filter</h2>
    <label>Larger than (MB) <input id="fSize" type="number" min="0" step="0.5" value="1" inputmode="decimal"></label>
    <label>Older than (years) <input id="fAge" type="number" min="0" step="1" value="5" inputmode="numeric"></label>
    <label>Type
      <select id="fType">
        <option value="any">Any</option>
        <option value="sent">Sent only</option>
        <option value="notsent">Everything except Sent</option>
        <option value="auto">Promotions, Updates, Forums, Social</option>
      </select>
    </label>
    <p id="fMatch" class="match"></p>
    <label>Gmail label to add <input id="fLabel" type="text" value="Sweeper review"></label>
    <div class="row">
      <button id="fApply" class="primary">Label matches in Gmail</button>
      <button id="fShow">Show biggest matches</button>
      <button id="fClear">Remove this label</button>
    </div>
  </section>
  <ul id="list"></ul>
</main>

<script>
const CLIENT_ID = '164588121644-fqbd137vllni6v951h5um974agbnrhs0.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/gmail.modify';
const API = 'https://gmail.googleapis.com/gmail/v1/users/me';
const WORKERS = 8;        // parallel requests in flight; the pacer below sets the real speed
let rate = 25;            // requests/sec we allow ourselves; drops on rate limits, creeps back up
const RATE_MIN = 4, RATE_MAX = 40;
let nextSlot = 0;         // pacing schedule: each request takes the next free time slot
let gate = 0;             // shared pause: nothing is sent before this timestamp
let okStreak = 0, throttled = false;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const say = (t, alert = false) => {
  $('status').textContent = t;
  $('status').classList.toggle('alert', alert);
};
// Messages from background retries must never overwrite a final status like "Paused" or "Session expired".
const sayIfRunning = t => { if (running) say(t); };
const msgs = n => n.toLocaleString() + (n === 1 ? ' message' : ' messages');
const fmt = b => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : b >= 1e6 ? (b/1e6).toFixed(1)+' MB' : Math.round(b/1e3)+' KB';

let token = null, running = false, total = 0, done = 0, scanStart = 0, doneAtStart = 0;
let needsReconnect = false, scanGen = 0, skipped = 0, badStreak = 0, syncing = false, resumeFn = null;

/* ---------- IndexedDB ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('mailsweeper', 1);
  r.onupgradeneeded = () => {
    r.result.createObjectStore('msgs', { keyPath: 'id' });
    r.result.createObjectStore('meta');
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function run(store, mode, fn) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const getMeta = k => run('meta', 'readonly', s => s.get(k));
const setMeta = (k, v) => run('meta', 'readwrite', s => { s.put(v, k); });
const countMsgs = () => run('msgs', 'readonly', s => s.count());
const putMany = rows => run('msgs', 'readwrite', s => { rows.forEach(r => s.put(r)); });
async function missing(ids) {
  const db = await dbp;
  return new Promise(res => {
    const t = db.transaction('msgs');
    const s = t.objectStore('msgs'), out = [];
    ids.forEach(id => { s.getKey(id).onsuccess = e => { if (e.target.result === undefined) out.push(id); }; });
    t.oncomplete = () => res(out);
  });
}

/* ---------- Auth ---------- */
function needReconnect() {
  needsReconnect = true;
  token = null;
  $('sync').disabled = true;
  $('connect').textContent = 'Reconnect & resume';
  say('Paused: your Gmail session expired (they last about an hour). Tap "Reconnect & resume" to carry on where you left off. Nothing was lost.', true);
}
function connect() {
  if (!window.google) { say('Google sign-in is still loading. Try again.'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: r => {
      if (r.error) { say('Sign-in failed: ' + r.error, true); return; }
      token = r.access_token;
      const resume = needsReconnect;
      needsReconnect = false;
      $('connect').textContent = 'Connect Gmail';
      $('scan').disabled = false;
      $('sync').disabled = false;
      if (resume) (resumeFn || scan)(); // came here because the session expired: carry on automatically
      else say('Connected. Tap Start scan. Sessions last about an hour.');
    }
  });
  client.requestAccessToken();
}

/* ---------- Gmail API with backoff ---------- */
async function api(path, opts = {}) {
  for (let a = 0; a < 8; a++) {
    // Wait for any shared pause, then take the next slot in the pacing schedule.
    const now = Date.now();
    const slot = Math.max(now, nextSlot, gate);
    nextSlot = slot + 1000 / rate;
    if (slot > now) await sleep(slot - now);
    let r;
    try {
      r = await fetch(API + path, {
        ...opts,
        headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }
      });
    } catch (e) {
      // "Failed to fetch": network dropped, phone slept, or an error response with no CORS headers.
      const ms = Math.min(30000, 1000 * 2 ** a) + Math.random() * 500;
      gate = Math.max(gate, Date.now() + ms);
      throttled = true;
      sayIfRunning(`Connection hiccup. Retrying in ${Math.round(ms / 1000)}s…`);
      continue;
    }
    if (r.ok) {
      if (throttled && Date.now() >= gate) { throttled = false; sayIfRunning('Scanning…'); }
      if (++okStreak >= 100 && rate < RATE_MAX) { rate = Math.min(RATE_MAX, rate + 2); okStreak = 0; }
      const text = await r.text();
      return text ? JSON.parse(text) : null; // batchModify answers 204 with no body
    }
    if (r.status === 401) { running = false; throw new Error('expired'); } // stop every worker
    const body = await r.json().catch(() => ({}));
    const err = body.error || {};
    const reason = (err.errors && err.errors[0] && err.errors[0].reason) || '';
    const limited = r.status === 429 || (r.status === 403 && /rate|quota/i.test(reason));
    if (limited || r.status >= 500) {
      okStreak = 0;
      rate = Math.max(RATE_MIN, rate * 0.7);
      let ms = Math.min(60000, 1500 * 2 ** a) + Math.random() * 500;
      // Google's message often says exactly when to retry; use that instead of guessing.
      const m = (err.message || '').match(/Retry after (\d{4}-\d\d-\d\dT[\d:.]+Z)/);
      if (m) ms = Math.min(120000, Math.max(1000, Date.parse(m[1]) - Date.now())) + Math.random() * 300;
      gate = Math.max(gate, Date.now() + ms);
      throttled = true;
      sayIfRunning(`Gmail asked us to slow down. Waiting ${Math.round(ms / 1000)}s, then continuing…`);
      continue;
    }
    const e = new Error(`HTTP ${r.status}: ${err.message || reason || 'request failed'}`);
    e.status = r.status;
    e.path = path.split('?')[0]; // which call failed, to make errors diagnosable
    throw e;
  }
  throw new Error('Gave up after repeated network or rate-limit errors. Check your connection, then press Start scan to resume.');
}

/* ---------- Keep the screen awake while scanning (phones) ---------- */
let wake = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) { /* not supported or denied: scan still works */ }
}
// The browser drops the lock whenever the tab is hidden; take it back when we return.
document.addEventListener('visibilitychange', () => {
  if (running && document.visibilityState === 'visible') keepAwake(true);
});

/* ---------- Scan ---------- */
async function countBad() {
  const db = await dbp;
  return new Promise(res => {
    let n = 0;
    const t = db.transaction('msgs');
    t.objectStore('msgs').openCursor().onsuccess = e => {
      const c = e.target.result;
      if (!c) return;
      if (c.value.bad) n++;
      c.continue();
    };
    t.oncomplete = () => res(n);
  });
}
function progress() {
  $('fill').style.width = total ? Math.min(100, done / total * 100) + '%' : '0';
  let line = `${done.toLocaleString()} of ${total.toLocaleString()} messages scanned`;
  const secs = (Date.now() - scanStart) / 1000, r = (done - doneAtStart) / secs;
  if (running && scanStart && secs > 20 && r > 0.5) {
    const min = Math.ceil((total - done) / r / 60);
    line += ` (about ${r.toFixed(0)}/sec, ${min > 90 ? Math.round(min / 60) + ' h' : min + ' min'} left)`;
  }
  if (skipped) line += `, ${skipped} unreadable`;
  $('counts').textContent = line;
}
async function pool(items, n, fn) {
  let i = 0;
  const g = scanGen; // workers from an earlier, aborted scan must not keep going
  await Promise.all(Array.from({ length: n }, async () => {
    while (running && g === scanGen && i < items.length) await fn(items[i++]);
  }));
}
function parseSender(headers) {
  const v = (headers && headers[0] && headers[0].value) || 'unknown';
  const m = v.match(/<([^>]+)>/);
  return (m ? m[1] : v).trim().toLowerCase();
}
async function scan(opts = {}) {
  resumeFn = () => scan(opts);
  scanGen++;
  skipped = 0; badStreak = 0;
  running = true;
  keepAwake(true);
  $('scan').disabled = true; $('sync').disabled = true; $('stop').disabled = false;
  try {
    const prof = await api('/profile');
    total = prof.messagesTotal;
    const startHist = prof.historyId; // changes after this point are caught by the next sync
    if (opts.fresh) await setMeta('scan', {});
    const meta = (await getMeta('scan')) || {};
    let page = opts.fresh ? undefined : meta.pageToken;
    let fullPass = !page; // listing from the very start, so we can tell what no longer exists
    const live = new Set();
    done = await countMsgs();
    scanStart = Date.now(); doneAtStart = done;
    progress(); say('Scanning…');
    while (running) {
      let list;
      try {
        list = await api('/messages?maxResults=500&includeSpamTrash=true' + (page ? '&pageToken=' + page : ''));
      } catch (e) {
        // A saved page token can go stale; start the listing over (already-saved messages are skipped quickly).
        if (e.status === 400 && page) { page = undefined; fullPass = true; live.clear(); await setMeta('scan', {}); continue; }
        throw e;
      }
      (list.messages || []).forEach(m => live.add(m.id));
      const todo = await missing((list.messages || []).map(m => m.id));
      const rows = [];
      try {
        await pool(todo, WORKERS, async id => {
          let m;
          try {
            m = await api(`/messages/${id}?format=metadata&metadataHeaders=From&fields=id,sizeEstimate,internalDate,labelIds,payload/headers`);
            badStreak = 0;
          } catch (e) {
            // Gmail refuses to return a few messages (400 "Precondition check failed") or they were
            // deleted since listing (404). Mark them so one bad message can't block the whole scan.
            if (e.status !== 400 && e.status !== 404) throw e;
            if (++badStreak > 20) throw e; // 20 in a row means something is really wrong; stop
            rows.push({ id, from: '(unreadable)', date: 0, size: 0, labels: [], bad: e.status });
            skipped++; done++;
            return;
          }
          rows.push({ id: m.id, from: parseSender(m.payload && m.payload.headers),
                      date: +m.internalDate, size: m.sizeEstimate, labels: m.labelIds || [] });
          done++;
          if (done % 25 === 0) progress();
        });
      } finally {
        await putMany(rows); // save whatever finished, even if paused or the session expired mid-page
      }
      progress();
      if (!running) break;
      page = list.nextPageToken;
      await setMeta('scan', { pageToken: page });
      if (!page) {
        const note = fullPass ? await finishFullPass(live, startHist) : '';
        const bad = await countBad();
        say('Scan complete.' + note + (bad ? ` Gmail wouldn't return ${bad} message${bad > 1 ? 's' : ''}, so they were skipped.` : '') + ' Run it again anytime to pick up new mail.');
        break;
      }
    }
    if (!running) say('Paused. Start scan resumes where it left off.');
  } catch (e) {
    if (e.message === 'expired') needReconnect();
    else say('Stopped: ' + e.message + (e.path ? ` (${e.path})` : ''), true);
  }
  running = false;
  keepAwake(false);
  $('stop').disabled = true;
  $('scan').disabled = needsReconnect; // can't scan again until we have a fresh token
  $('sync').disabled = needsReconnect;
}

/* ---------- Sync with Gmail ---------- */
const deleteMany = ids => run('msgs', 'readwrite', st => { ids.forEach(id => st.delete(id)); });
async function eachLimit(items, n, fn) {
  let i = 0, failed = false;
  await Promise.all(Array.from({ length: n }, async () => {
    while (!failed && i < items.length) {
      try { await fn(items[i++]); } catch (e) { failed = true; throw e; }
    }
  }));
}
async function listIds(labelId) {
  const ids = new Set();
  let page;
  do {
    const r = await api(`/messages?labelIds=${labelId}&maxResults=500&includeSpamTrash=true` + (page ? '&pageToken=' + page : ''));
    (r.messages || []).forEach(m => ids.add(m.id));
    page = r.nextPageToken;
  } while (page);
  return ids;
}
// Make the cached Trash flag match Gmail (covers things trashed while we weren't watching).
async function refreshTrash() {
  const trash = await listIds('TRASH');
  const all = await run('msgs', 'readonly', st => st.getAll());
  const changed = [];
  all.forEach(m => {
    const has = m.labels.includes('TRASH'), want = trash.has(m.id);
    if (want && !has) { m.labels.push('TRASH'); changed.push(m); }
    else if (!want && has) { m.labels = m.labels.filter(l => l !== 'TRASH'); changed.push(m); }
  });
  if (changed.length) await putMany(changed);
}
// After a scan that listed every message from the start: forget what Gmail no longer has,
// refresh Trash flags, and remember where Gmail's change history stood when we began.
async function finishFullPass(live, startHist) {
  const keys = await run('msgs', 'readonly', st => st.getAllKeys());
  const gone = keys.filter(k => !live.has(k));
  let note = '';
  if (gone.length && live.size < keys.length * 0.5) {
    note = ' Skipped removing old entries because Gmail listed far fewer messages than expected.';
  } else if (gone.length) {
    await deleteMany(gone);
    note = ` Dropped ${msgs(gone.length)} that no longer exist in Gmail.`;
  }
  await refreshTrash();
  await setMeta('history', { id: startHist, at: Date.now() });
  done = await countMsgs(); progress();
  return note;
}

async function fetchRow(id) {
  try {
    const m = await api(`/messages/${id}?format=metadata&metadataHeaders=From&fields=id,sizeEstimate,internalDate,labelIds,payload/headers`);
    return { id: m.id, from: parseSender(m.payload && m.payload.headers), date: +m.internalDate, size: m.sizeEstimate, labels: m.labelIds || [] };
  } catch (e) {
    if (e.status === 404) return null; // deleted since the history entry
    if (e.status === 400) return { id, from: '(unreadable)', date: 0, size: 0, labels: [], bad: 400 };
    throw e;
  }
}

// Ask Gmail what changed since startId and apply it to the local copy.
async function syncHistory(startId) {
  const records = [];
  let page, latest = startId;
  do {
    const r = await api(`/history?startHistoryId=${startId}&maxResults=500&historyTypes=messageAdded&historyTypes=messageDeleted&historyTypes=labelAdded&historyTypes=labelRemoved` + (page ? '&pageToken=' + page : ''));
    if (r.historyId) latest = r.historyId;
    (r.history || []).forEach(h => records.push(h));
    page = r.nextPageToken;
  } while (page);

  const byId = new Map((await run('msgs', 'readonly', st => st.getAll())).map(m => [m.id, m]));
  const fresh = new Set(), gone = new Set(), dirty = new Map();
  const touch = (x, change) => {
    const row = byId.get(x.message.id);
    if (!row || gone.has(row.id)) return; // not cached (new messages are fetched whole below)
    change(row, x.labelIds || []);
    dirty.set(row.id, row);
  };
  records.forEach(h => {          // oldest first, so the final state wins
    (h.messagesAdded || []).forEach(x => { gone.delete(x.message.id); if (!byId.has(x.message.id)) fresh.add(x.message.id); });
    (h.messagesDeleted || []).forEach(x => { gone.add(x.message.id); fresh.delete(x.message.id); });
    (h.labelsAdded || []).forEach(x => touch(x, (row, ls) => ls.forEach(l => { if (!row.labels.includes(l)) row.labels.push(l); })));
    (h.labelsRemoved || []).forEach(x => touch(x, (row, ls) => { row.labels = row.labels.filter(l => !ls.includes(l)); }));
  });

  const added = [];
  await eachLimit([...fresh], 6, async id => { const row = await fetchRow(id); if (row) added.push(row); });
  const removed = [...gone].filter(id => byId.has(id));
  gone.forEach(id => dirty.delete(id));
  if (removed.length) await deleteMany(removed);
  await putMany([...dirty.values(), ...added]);
  await setMeta('history', { id: latest, at: Date.now() });
  return { added: added.length, removed: removed.length, relabelled: dirty.size };
}

async function sync() {
  if (running || syncing) return;
  if (!token) { say('Tap Connect Gmail first.', true); return; }
  syncing = true; resumeFn = sync;
  $('sync').disabled = true; $('scan').disabled = true;
  try {
    const h = await getMeta('history');
    if (h && h.id) {
      say('Checking Gmail for changes…');
      try {
        const r = await syncHistory(h.id);
        say(`Synced. ${msgs(r.added)} new, ${r.removed} removed, labels changed on ${msgs(r.relabelled)}.`);
        return;
      } catch (e) {
        if (e.status !== 404) throw e;
        say('Gmail no longer keeps change history that far back. Doing a full check instead…');
      }
    } else say('First sync: comparing everything with Gmail. This takes a few minutes…');
    syncing = false;
    await scan({ fresh: true });
  } catch (e) {
    if (e.message === 'expired') needReconnect();
    else say('Sync stopped: ' + e.message, true);
  } finally {
    syncing = false;
    $('scan').disabled = needsReconnect; $('sync').disabled = needsReconnect;
    if (!$('filter').hidden) { reviewRows = await everything(); updateMatch(); } // keep the open review panel current
  }
}

/* ---------- Report ---------- */
const everything = async () => (await run('msgs', 'readonly', st => st.getAll())).filter(m => !m.bad);

// sections: [{ title, rows: [{ label, sub, bytes, num, id }] }]
function renderSections(sections) {
  const list = $('list');
  list.replaceChildren();
  sections.forEach(sec => {
    const h = document.createElement('li');
    h.className = 'head'; h.textContent = sec.title;
    list.appendChild(h);
    sec.rows.forEach(r => {
      const li = document.createElement('li');
      if (r.id) li.dataset.id = r.id;
      const who = document.createElement('span'); who.className = 'who';
      who.append(document.createTextNode(r.label));
      if (r.sub) { const sb = document.createElement('small'); sb.className = 'sub'; sb.textContent = r.sub; who.appendChild(sb); }
      const size = document.createElement('span'); size.className = 'size'; size.textContent = fmt(r.bytes);
      const num = document.createElement('span'); num.className = 'num'; num.textContent = r.num || '';
      size.appendChild(num);
      li.append(who, size);
      list.appendChild(li);
    });
  });
}

async function report() {
  const all = await everything();
  if (!all.length) { say('Nothing scanned yet.'); return; }
  const by = {};
  all.forEach(m => { const g = by[m.from] || (by[m.from] = { n: 0, bytes: 0 }); g.n++; g.bytes += m.size; });
  const top = Object.entries(by).sort((a, b) => b[1].bytes - a[1].bytes).slice(0, 25);
  renderSections([{ title: 'Top senders by size', rows: top.map(([from, g]) => ({ label: from, bytes: g.bytes, num: msgs(g.n) })) }]);
}

// Where is the space? Every message goes into exactly one bucket per breakdown.
const LABEL_GROUPS = [
  ['Trash', l => l.includes('TRASH')], ['Spam', l => l.includes('SPAM')], ['Sent', l => l.includes('SENT')],
  ['Promotions', l => l.includes('CATEGORY_PROMOTIONS')], ['Social', l => l.includes('CATEGORY_SOCIAL')],
  ['Updates', l => l.includes('CATEGORY_UPDATES')], ['Forums', l => l.includes('CATEGORY_FORUMS')],
  ['Inbox', l => l.includes('INBOX')], ['Archived (everything else)', () => true]
];
const AGE_BUCKETS = [['Over 10 years old', 10], ['5 to 10 years', 5], ['2 to 5 years', 2], ['1 to 2 years', 1], ['Under 1 year', 0]];
const SIZE_BUCKETS = [['10 MB and up', 1e7], ['1 to 10 MB', 1e6], ['100 KB to 1 MB', 1e5], ['Under 100 KB', 0]];

function tally(all, defs, pick, totalBytes) {
  const out = defs.map(d => ({ label: d[0], n: 0, bytes: 0 }));
  all.forEach(m => { const o = out[pick(m)]; o.n++; o.bytes += m.size; });
  return out.filter(o => o.n).sort((a, b) => b.bytes - a.bytes).map(o => ({
    label: o.label, bytes: o.bytes,
    num: `${msgs(o.n)} · ${Math.round(o.bytes / totalBytes * 100)}%`
  }));
}
async function overview() {
  const all = await everything();
  if (!all.length) { say('Nothing scanned yet.'); return; }
  const total = all.reduce((t, m) => t + m.size, 0), now = Date.now();
  const years = m => (now - m.date) / (365.25 * 864e5);
  renderSections([
    { title: 'Everything scanned', rows: [{ label: 'All messages', bytes: total, num: msgs(all.length) }] },
    { title: 'By type', rows: tally(all, LABEL_GROUPS, m => LABEL_GROUPS.findIndex(g => g[1](m.labels)), total) },
    { title: 'By age', rows: tally(all, AGE_BUCKETS, m => AGE_BUCKETS.findIndex(b => years(m) >= b[1]), total) },
    { title: 'By message size', rows: tally(all, SIZE_BUCKETS, m => SIZE_BUCKETS.findIndex(b => m.size >= b[1]), total) }
  ]);
}

const when = m => new Date(m.date).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
const subLine = m => when(m) + (m.labels.includes('SENT') ? ' · sent' : '');

// Show messages as a list; fetch subject lines when connected.
async function showMessages(title, list) {
  renderSections([{ title, rows: list.map(m => ({ id: m.id, label: m.from, sub: subLine(m), bytes: m.size })) }]);
  if (!token) { say('Connect Gmail to also see subject lines.'); return; }
  say('Loading subject lines…');
  for (const m of list) {
    try {
      const r = await api(`/messages/${m.id}?format=metadata&metadataHeaders=Subject&fields=payload/headers`);
      const subj = r.payload && r.payload.headers && r.payload.headers[0] && r.payload.headers[0].value;
      const row = document.querySelector(`#list li[data-id="${m.id}"] .who`);
      if (row && subj) {
        row.firstChild.textContent = subj;
        row.querySelector('.sub').textContent = m.from + ' · ' + subLine(m);
      }
    } catch (e) { if (e.message === 'expired') { say('Session expired. Tap Connect Gmail to load subject lines.', true); return; } }
  }
  say('');
}
async function biggest() {
  const all = (await everything()).sort((a, b) => b.size - a.size).slice(0, 25);
  if (!all.length) { say('Nothing scanned yet.'); return; }
  showMessages('Biggest messages', all);
}

/* ---------- Review filter + labelling ---------- */
const AUTO = ['CATEGORY_PROMOTIONS', 'CATEGORY_UPDATES', 'CATEGORY_FORUMS', 'CATEGORY_SOCIAL'];
const TYPE_TESTS = {
  any: () => true,
  sent: l => l.includes('SENT'),
  notsent: l => !l.includes('SENT'),
  auto: l => AUTO.some(c => l.includes(c))
};
let reviewRows = [];

function matching() {
  const minBytes = (parseFloat($('fSize').value) || 0) * 1e6;
  const minAge = (parseFloat($('fAge').value) || 0) * 365.25 * 864e5;
  const test = TYPE_TESTS[$('fType').value], now = Date.now();
  // Trash is always excluded: those messages are already on their way out.
  return reviewRows.filter(m => m.size >= minBytes && now - m.date >= minAge && !m.labels.includes('TRASH') && test(m.labels));
}
function updateMatch() {
  const m = matching(), bytes = m.reduce((t, x) => t + x.size, 0);
  $('fMatch').textContent = m.length ? `${msgs(m.length)} · ${fmt(bytes)} match` : 'Nothing matches these settings.';
}
async function openReview() {
  $('filter').hidden = false;
  reviewRows = await everything();
  if (!reviewRows.length) { say('Nothing scanned yet.'); return; }
  updateMatch();
  $('filter').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function showMatches() {
  const m = matching().sort((a, b) => b.size - a.size).slice(0, 25);
  if (!m.length) { say('Nothing matches these settings.'); return; }
  showMessages('Biggest matches', m);
}

async function findLabel(name) {
  const r = await api('/labels');
  const l = (r.labels || []).find(x => x.name.toLowerCase() === name.toLowerCase());
  return l ? l.id : null;
}
async function ensureLabel(name) {
  const found = await findLabel(name);
  if (found) return found;
  const r = await api('/labels', { method: 'POST', body: JSON.stringify({ name, labelListVisibility: 'labelShow', messageListVisibility: 'show' }) });
  return r.id;
}
async function batchLabel(ids, body) {
  for (let i = 0; i < ids.length; i += 1000) {
    await api('/messages/batchModify', { method: 'POST', body: JSON.stringify({ ids: ids.slice(i, i + 1000), ...body }) });
    say(`Working… ${Math.min(i + 1000, ids.length).toLocaleString()} of ${ids.length.toLocaleString()}`);
  }
}
const labelName = () => $('fLabel').value.trim();

async function applyLabel() {
  const name = labelName(), m = matching();
  if (!token) { say('Tap Connect Gmail first.', true); return; }
  if (!name) { say('Enter a label name.', true); return; }
  if (!m.length) { say('Nothing matches these settings.'); return; }
  try {
    const id = await ensureLabel(name);
    await batchLabel(m.map(x => x.id), { addLabelIds: [id] });
    m.forEach(x => { if (!x.labels.includes(id)) x.labels.push(id); });
    await putMany(m); // keep the local copy in step with Gmail
    say(`Added the label "${name}" to ${msgs(m.length)}. Open that label in Gmail to review them. Nothing was moved or deleted.`);
  } catch (e) {
    if (e.message === 'expired') say('Session expired. Tap Connect Gmail, then try again.', true);
    else say('Labelling stopped: ' + e.message, true);
  }
}
async function removeLabel() {
  const name = labelName();
  if (!token) { say('Tap Connect Gmail first.', true); return; }
  try {
    const id = name && await findLabel(name);
    if (!id) { say(`No label called "${name}" exists in Gmail.`); return; }
    const m = reviewRows.filter(x => x.labels.includes(id));
    await batchLabel(m.map(x => x.id), { removeLabelIds: [id] });
    m.forEach(x => { x.labels = x.labels.filter(l => l !== id); });
    await putMany(m);
    say(`Removed "${name}" from ${msgs(m.length)}. The label itself is still in Gmail; delete it there if you like.`);
  } catch (e) {
    if (e.message === 'expired') say('Session expired. Tap Connect Gmail, then try again.', true);
    else say('Stopped: ' + e.message, true);
  }
}

$('connect').onclick = connect;
$('scan').onclick = () => scan();
$('sync').onclick = sync;
$('stop').onclick = () => { running = false; };
$('report').onclick = report;
$('overview').onclick = overview;
$('biggest').onclick = biggest;
$('review').onclick = openReview;
['fSize', 'fAge', 'fType'].forEach(id => $(id).addEventListener('input', updateMatch));
$('fShow').onclick = showMatches;
$('fApply').onclick = applyLabel;
$('fClear').onclick = removeLabel;
countMsgs().then(n => { if (n) { done = n; $('counts').textContent = `${n.toLocaleString()} messages saved from an earlier scan`; } });
</script>
</body>
</html>
